<!DOCTYPE html>
<html>
<head>
<style>
*{
    transition: all 0.6s;
}

html {
    height: 100%;
}

body{
    font-family: 'Lato', sans-serif;
    color: rgb(255, 255, 255);
	background-color:  #0c0d16;
    margin: 0;
}

#main{
    display: table;
    width: 100%;
    height: 100vh;
    text-align: center;
}

.fof{
	  display: table-cell;
	  vertical-align: middle;
}

.fof h1{
	  font-size: 50px;
	  display: inline-block;
	  padding-right: 12px;
	  animation: type .5s alternate infinite;
}

@keyframes type{
	  from{box-shadow: inset -3px 0px 0px rgb(255, 255, 255);}
	  to{box-shadow: inset -3px 0px 0px transparent;}
}
</style>
</head>
<body>
    
<div id="main">
    	<div class="fof">
        		<h1 class="mt-5 text-white text-mono">Error 404...</h1>
				<br>
				<h1 class="mt-5 text-white text-mono">This website does not exist!</h1>
    	</div>
</div>

</body>
</html>
